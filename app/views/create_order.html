<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Floristería - Panel</title>
  <link rel="stylesheet" href="../../assets/css/styles.css">
  <link rel="icon" href="../../assets/img/logo_fondo_blanco.jpg">
</head>
<body>
  <section class="app">
    <aside class="sidebar">
      <section class="logo">
        <span class="brand"><img src="../../assets/img/logo.png" alt="Flores Nuria"></span>
      </section>
      <nav class="nav" aria-label="navegación principal">
        <h4>Navegación</h4>
        <ul>
          <li><a href="dashboard.html">Dashboard</a></li>
          <li><a href="reports.html">Informes</a></li>
          <li><a href="payments.html">Cobros/Pagos</a></li>
          <!-- <li><a href="schedule.html">Agenda</a></li> -->
          <li><a href="products.html">Productos</a></li>
          <li><a href="offers.html">Ofertas</a></li>
          <li class="active"><a href="orders.html">Pedidos</a></li>
          <!-- <li><a href="customers.html">Clientes</a></li> -->
          <li><a href="suppliers.html">Proveedores</a></li>
          <!-- <li><a href="employees.html">Empleados</a></li> -->
        </ul>
      </nav>
    </aside>
    <main class="main">
      <header class="header">
        <section class="left">
          <section class="logo">
            <button class="menu-toggle" type="button">☰</button>
          </section>
          <nav class="breadcrumbs" aria-label="breadcrumb">
            <ol><li>Dashboard</li><li>Realizar Pedido</li></ol>
          </nav>
        </section>
        <section class="right user-menu-container">
          <button class="user-circle" type="button" aria-haspopup="true" aria-expanded="false">U</button>
          <div class="user-dropdown" role="menu">
            <div class="user-dropdown-info">
              <strong>Usuario</strong>
              <span class="user-dropdown-role">Personal</span>
            </div>
            <div class="dropdown-divider"></div>
            <a href="login.html" role="menuitem"><span class="icon">🚪</span> Cerrar Sesión</a>
          </div>
        </section>
      </header>
      <section class="container">
        <section class="toolbar d-flex gap-2 mb-3">
          <a href="orders.html" class="btn secondary text-decoration-none d-flex align-center px-3">&laquo; Volver a Pedidos</a>
        </section>

        <h3 class="mt-5 mb-3">Realizar Nuevo Pedido</h3>

        <section class="form">
          <form id="form-create-order" action="orders.html" method="get">
            <section class="row">
              <section class="flex-2">
                <label>Proveedor *</label>
                <select name="id_proveedor" id="select-proveedor" required>
                  <option value="">-- Seleccionar Proveedor --</option>
                  <option value="1">Viveros el Sol</option>
                  <option value="2">Flores del Valle</option>
                  <option value="3">Cerámicas Ruiz</option>
                </select>
              </section>
              <section class="flex-1">
                <label>Fecha del Pedido</label>
                <input type="date" name="fecha" id="fecha-pedido" value="2026-10-07" required>
              </section>
              <section class="flex-1">
                <label>Estado</label>
                <select name="estado">
                  <option value="Pendiente" selected>Pendiente</option>
                  <option value="Recibido">Recibido</option>
                  <option value="Cancelado">Cancelado</option>
                </select>
              </section>
            </section>

            <h4 class="mt-4 mb-3 border-bottom-light pb-2">Añadir Productos al Pedido</h4>
            <section id="productos-container">
              <!-- Fila de producto base -->
              <section class="row producto-row mb-2">
                <section class="flex-2">
                  <select name="productos[]" class="select-producto">
                    <option value="">-- Seleccionar Producto --</option>
                    <option value="1">Rosa roja (Stock: 120)</option>
                    <option value="2">Tulipán amarillo (Stock: 200)</option>
                    <option value="3">Orquídea blanca (Stock: 15)</option>
                    <option value="4">Maceta de cerámica (Stock: 0)</option>
                    <option value="5">Girasol (Stock: 80)</option>
                  </select>
                </section>
                <section class="flex-1">
                  <input type="number" name="cantidades[]" placeholder="Cantidad" min="0">
                </section>
                <section class="flex-0 align-self-center">
                  <button type="button" class="btn secondary" data-remove-row>X</button>
                </section>
              </section>
            </section>

            <section class="mt-2">
              <button type="button" class="btn secondary" id="add-row">+ Añadir otro producto</button>
            </section>

            <section class="row mt-4">
              <button type="submit" class="btn">Guardar Pedido</button>
            </section>
          </form>
        </section>

        <footer class="footer">© 2026 Flores Nuria · Creación de pedidos</footer>
      </section>
    </main>
  </section>
</body>
</html>
