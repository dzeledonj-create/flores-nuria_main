<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Floristería - Panel</title>
  <link rel="stylesheet" href="../../assets/css/styles.css">
  <link rel="icon" href="../../assets/img/logo_fondo_blanco.jpg">
  <script src="../../assets/js/core/api.js" defer></script>
  <script src="../../assets/js/core/utils.js" defer></script>
  <script src="../../assets/js/core/layout.js" defer></script>
  <script src="../../assets/js/pages/create_tiket.js" defer></script>
</head>
<body>
  <section class="app">
    <div data-include="sidebar"></div>
    <main class="main">
      <div data-include="header"></div>
      <section class="container">
        <section class="toolbar d-flex gap-2 mb-3">
          <a href="payments.html" class="btn secondary text-decoration-none d-flex align-center px-3">&laquo; Volver a Pagos</a>
        </section>
        <div id="msg"></div>

        <section class="table-wrap d-none" id="tickets-wrap">
          <table class="table">
            <thead>
              <tr>
                <th>Nº de ticket</th>
                <th>Empleado</th>
                <th>Cliente</th>
                <th>Fecha</th>
                <th>Precio Total</th>
              </tr>
            </thead>
            <tbody id="tickets-body"></tbody>
          </table>
        </section>

        <button type="button" class="btn mt-3" id="export-tickets">Crear/Actualizar Tickets (JSON)</button>

        <footer class="footer">© 2026 Flores Nuria · Exportación de tickets</footer>
      </section>
    </main>
  </section>
</body>
</html>
