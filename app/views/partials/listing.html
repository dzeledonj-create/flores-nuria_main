<!-- PLANTILLA «Pantalla de listado» (Design System, apartado 2.10).
     Zonas: A sidebar · B topbar · C page-header · D toolbar · E tabla + paginación.
     La usan Cobros/Pagos, Productos, Ofertas, Pedidos y Proveedores: solo cambian C, D y E. -->
        <header class="page-header">
          <h1 class="page-header__title">Título de la sección</h1>
          <p class="page-header__desc">Descripción breve de la tarea.</p>
        </header>
        <div class="toolbar">
          <form class="toolbar__form" role="search" action="items.html" method="get">
            <div class="field toolbar__search">
              <label class="field__label" for="search-items-table">Buscar</label>
              <div class="input-wrap input-wrap--lead">
                <svg class="input-wrap__icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m21 21-4.34-4.34" /> <circle cx="11" cy="11" r="8" /></svg>
                <input class="input" type="search" id="search-items-table" name="q" placeholder="Buscar…">
              </div>
            </div>
            <button class="btn btn--secondary" type="submit">Buscar</button>
          </form>
          <div class="toolbar__actions">
            <a class="btn btn--secondary" href="items.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M18 6 6 18" /> <path d="m6 6 12 12" /></svg>Mostrar todo</a>
            <a class="btn btn--primary" href="create.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 12h14" /> <path d="M12 5v14" /></svg>Acción principal</a>
          </div>
        </div>
        <div class="table-wrap">
          <table class="table" id="items-table">
            <caption class="visually-hidden">Listado</caption>
            <thead>
              <tr><th scope="col">Columna</th><th scope="col" class="num">Importe</th><th scope="col">Estado</th><th scope="col" class="actions-col"><span class="visually-hidden">Acciones</span></th></tr>
            </thead>
            <tbody>
              <tr><td data-label="Columna" class="strong">Elemento</td><td data-label="Importe" class="num">10,00 €</td><td data-label="Estado"><span class="badge badge--success">Activo</span></td><td data-label="Acciones"><div class="actions"><a class="btn btn--ghost btn--icon btn--sm" href="#edit-panel" aria-label="Editar Elemento"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z" /> <path d="m15 5 4 4" /></svg></a><a class="btn btn--ghost-danger btn--icon btn--sm" href="#confirm-delete" aria-label="Eliminar Elemento"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M10 11v6" /> <path d="M14 11v6" /> <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" /> <path d="M3 6h18" /> <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" /></svg></a></div></td></tr>
            </tbody>
          </table>
        </div>
        <nav class="pagination" aria-label="Paginación de elementos">
          <p class="pagination__info">Mostrando 1 de 1 elementos</p>
          <div class="pagination__list">
            <span class="pagination__item" aria-disabled="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m15 18-6-6 6-6" /></svg><span>Anterior</span></span>
            <a class="pagination__item" href="#main" aria-current="page"><span class="visually-hidden">Página </span>1</a>
            <span class="pagination__item" aria-disabled="true"><span>Siguiente</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m9 18 6-6-6-6" /></svg></span>
          </div>
        </nav>
