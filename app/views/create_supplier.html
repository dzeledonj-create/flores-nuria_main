<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Floristería - Panel</title>
  <link rel="stylesheet" href="../../assets/css/styles.css">
  <link rel="icon" href="../../assets/img/logo_fondo_blanco.jpg">
</head>
<body>
  <section class="app">
    <aside class="sidebar">
      <section class="logo">
        <span class="brand"><img src="../../assets/img/logo.png" alt="Flores Nuria"></span>
      </section>
      <nav class="nav" aria-label="navegación principal">
        <h4>Navegación</h4>
        <ul>
          <li><a href="dashboard.html">Dashboard</a></li>
          <li><a href="reports.html">Informes</a></li>
          <li><a href="payments.html">Cobros/Pagos</a></li>
          <!-- <li><a href="schedule.html">Agenda</a></li> -->
          <li><a href="products.html">Productos</a></li>
          <li><a href="offers.html">Ofertas</a></li>
          <li><a href="orders.html">Pedidos</a></li>
          <!-- <li><a href="customers.html">Clientes</a></li> -->
          <li class="active"><a href="suppliers.html">Proveedores</a></li>
          <!-- <li><a href="employees.html">Empleados</a></li> -->
        </ul>
      </nav>
    </aside>
    <main class="main">
      <header class="header">
        <section class="left">
          <section class="logo">
            <button class="menu-toggle" type="button">☰</button>
          </section>
          <nav class="breadcrumbs" aria-label="breadcrumb">
            <ol><li>Dashboard</li><li>Crear Proveedor</li></ol>
          </nav>
        </section>
        <section class="right user-menu-container">
          <button class="user-circle" type="button" aria-haspopup="true" aria-expanded="false">U</button>
          <div class="user-dropdown" role="menu">
            <div class="user-dropdown-info">
              <strong>Usuario</strong>
              <span class="user-dropdown-role">Personal</span>
            </div>
            <div class="dropdown-divider"></div>
            <a href="login.html" role="menuitem"><span class="icon">🚪</span> Cerrar Sesión</a>
          </div>
        </section>
      </header>
      <section class="container">
        <section class="toolbar d-flex gap-2 mb-3">
          <a href="suppliers.html" class="btn secondary text-decoration-none d-flex align-center px-3">&laquo; Volver a Proveedores</a>
        </section>

        <h3 class="mt-5 mb-3">Crear Nuevo Proveedor</h3>

        <section class="form">
          <form id="form-create-supplier" action="suppliers.html" method="get">
            <section class="row">
              <section class="flex-2">
                <label>Nombre del Proveedor *</label>
                <input type="text" name="nombre" placeholder="Ej: Viveros el Sol" required>
              </section>
              <section class="flex-2">
                <label>Dirección</label>
                <input type="text" name="direccion" placeholder="Ej: Calle Principal 123">
              </section>
            </section>

            <section class="row mt-4">
              <section class="flex-1">
                <label>Teléfono</label>
                <input type="tel" name="telefono" placeholder="Ej: 600123456" pattern="[0-9]{9}" maxlength="9">
              </section>
              <section class="flex-1">
                <label>Correo Electrónico</label>
                <input type="email" name="correo" placeholder="Ej: proveedor@correo.com">
              </section>
            </section>

            <section class="row mt-4">
              <button type="submit" class="btn">Guardar Proveedor</button>
            </section>
          </form>
        </section>

        <footer class="footer">© 2026 Flores Nuria · Creación de proveedores</footer>
      </section>
    </main>
  </section>
</body>
</html>
