<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Iniciar Sesión - Flores Nuria</title>
  <link rel="stylesheet" href="../../assets/css/styles.css">
  <link rel="icon" href="../../assets/img/logo_fondo_blanco.jpg">
  <script src="../../assets/js/core/api.js" defer></script>
  <script src="../../assets/js/pages/login.js" defer></script>
</head>
<body>
  <section class="login-wrapper">
    <article class="login-card">
      <img src="../../assets/img/logo.png" alt="Flores Nuria Logo" class="login-logo">
      <h1 class="login-title">Flores Nuria</h1>
      <p class="login-subtitle">Gestión de Administración</p>

      <div class="login-error" id="login-error" style="display:none"></div>

      <form id="login-form" class="login-form">
        <div class="form-group">
          <label for="correo">Correo Electrónico</label>
          <input type="email" id="correo" name="correo" placeholder="correo@ejemplo.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <button type="submit" class="login-btn">Iniciar Sesión</button>
      </form>
    </article>
  </section>
</body>
</html>
