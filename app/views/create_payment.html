<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Floristería - Panel</title>
  <link rel="stylesheet" href="../../public/css/styles.css">
  <link rel="icon" href="../../public/img/logo_fondo_blanco.jpg">
</head>
<body>
  <section class="app">
    <aside class="sidebar">
      <section class="logo">
        <span class="brand"><img src="../../public/img/logo.png" alt="Flores Nuria"></span>
      </section>
      <nav class="nav" aria-label="navegación principal">
        <h4>Navegación</h4>
        <ul>
          <li><a href="dashboard.html">Dashboard</a></li>
          <li><a href="reports.html">Informes</a></li>
          <li class="active"><a href="payments.html">Cobros/Pagos</a></li>
          <!-- <li><a href="schedule.html">Agenda</a></li> -->
          <li><a href="products.html">Productos</a></li>
          <li><a href="offers.html">Ofertas</a></li>
          <li><a href="orders.html">Pedidos</a></li>
          <!-- <li><a href="customers.html">Clientes</a></li> -->
          <li><a href="suppliers.html">Proveedores</a></li>
          <!-- <li><a href="employees.html">Empleados</a></li> -->
        </ul>
      </nav>
    </aside>
    <main class="main">
      <header class="header">
        <section class="left">
          <section class="logo">
            <button class="menu-toggle" type="button">☰</button>
          </section>
          <nav class="breadcrumbs" aria-label="breadcrumb">
            <ol><li>Dashboard</li><li>Registrar Venta</li></ol>
          </nav>
        </section>
        <section class="right user-menu-container">
          <button class="user-circle" type="button" aria-haspopup="true" aria-expanded="false">U</button>
          <div class="user-dropdown" role="menu">
            <div class="user-dropdown-info">
              <strong>Usuario</strong>
              <span class="user-dropdown-role">Personal</span>
            </div>
            <div class="dropdown-divider"></div>
            <a href="login.html" role="menuitem"><span class="icon">🚪</span> Cerrar Sesión</a>
          </div>
        </section>
      </header>
      <section class="container">
        <section class="toolbar d-flex gap-2 mb-3">
          <a href="payments.html" class="btn secondary text-decoration-none d-flex align-center px-3">&laquo; Volver a Pagos</a>
        </section>

        <h3 class="mt-5 mb-3">Crear Nuevo Pago</h3>

        <section class="form">
          <form id="form-create-payment" action="payments.html" method="get">
            <section class="row">

              <section class="flex-2">
                <label>Producto *</label>
                <input type="text" id="search-prod" placeholder="Buscar producto..." class="flex-1 px-3-py-1 border-base rounded-sm" style="max-width: 300px;">
                <select name="pedido_id" id="select-prod" required>
                  <option value="">-- Seleccionar Producto --</option>
                  <option value="1">Rosa roja - 120</option>
                  <option value="2">Tulipán amarillo - 200</option>
                  <option value="3">Orquídea blanca - 15</option>
                  <option value="5">Girasol - 80</option>
                </select>
              </section>

              <section class="flex-2">
                <label>Cliente</label>
                <input type="text" id="search-client" placeholder="Nombre del cliente" class="flex-1 px-3-py-1 border-base rounded-sm">
                <select name="cliente_id" id="select-client" required>
                  <option value="">-- Seleccionar Cliente --</option>
                  <option value="1">Maria Menendez - maria@correo.com</option>
                  <option value="2">Jose Maria Garcia - josemaria@correo.com</option>
                </select>
              </section>
              <section class="flex-1">
                <label>Monto (€) *</label>
                <input type="number" step="0.01" name="monto" min="0.01" required>
              </section>
              <section class="flex-1">
                <label>Método de Pago *</label>
                <select name="metodo" required>
                  <option value="">-- Seleccionar --</option>
                  <option value="efectivo">Efectivo</option>
                  <option value="tarjeta">Tarjeta</option>
                  <option value="transferencia">Transferencia</option>
                  <option value="otros">Otros</option>
                </select>
              </section>
            </section>

            <section class="row mt-4">
              <section class="flex-1">
                <label>Fecha</label>
                <input type="date" name="fecha" id="fecha-pago" value="2026-10-07">
              </section>
            </section>

            <section class="row mt-4">
              <button type="submit" class="btn">Guardar Pago</button>
            </section>
          </form>
        </section>

        <footer class="footer">© 2026 Flores Nuria · Creación de pagos</footer>
      </section>
    </main>
  </section>
</body>
</html>
