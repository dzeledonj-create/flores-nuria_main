<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Floristería - Panel</title>
  <link rel="stylesheet" href="../../assets/css/styles.css">
  <link rel="icon" href="../../assets/img/logo_fondo_blanco.jpg">
  <script src="../../assets/js/core/api.js" defer></script>
  <script src="../../assets/js/core/utils.js" defer></script>
  <script src="../../assets/js/core/layout.js" defer></script>
  <script src="../../assets/js/pages/products.js" defer></script>
</head>
<body>
  <section class="app">
    <div data-include="sidebar"></div>
    <main class="main">
      <div data-include="header"></div>
      <section class="container">
        <div id="msg"></div>
        <section class="toolbar d-flex gap-2 mb-3">
          <form id="search-form" class="d-flex gap-2 m-0">
            <input type="text" name="search" placeholder="Buscar producto..." class="px-3-py-1 border-base rounded-sm outline-none">
            <button type="submit" class="btn">Buscar</button>
          </form>
          <form id="category-form" class="d-flex gap-2 m-0">
            <select name="category" id="category-select" class="px-3 py-1 rounded-sm">
              <option value="" selected>Seleccione categoria...</option>
            </select>
            <button type="submit" class="btn secondary">Familias</button>
          </form>

          <button type="button" id="show-all" class="btn pill green d-flex align-center px-3">Mostrar Todo</button>
          <a href="create_product.html" class="btn secondary text-decoration-none d-flex align-center px-3">Nuevo producto</a>
        </section>

        <section class="table-wrap">
          <table class="table">
            <thead>
              <tr>
                <th>Nombre</th>
                <th>Oferta</th>
                <th>Precio Base</th>
                <th>IVA</th>
                <th>Precio Final</th>
                <th>Stock</th>
                <th>Estado</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="products-body">
              <tr><td colspan="8" class="text-center">Cargando...</td></tr>
            </tbody>
          </table>
        </section>

        <h3 id="edit-title" class="mt-5 d-none">Editar producto</h3>
        <section class="form">
          <form id="form-edit-product" class="d-none">
            <input type="hidden" name="idProducto" id="edit-id">

            <section class="row">
              <section class="flex-2">
                <label>Nombre del Producto *</label>
                <input type="text" name="nombre" id="edit-nombre" required>
              </section>
              <section class="flex-1">
                <label>Precio Base (€) *</label>
                <input type="number" step="0.01" name="precio" id="edit-precio" required>
              </section>
              <section class="flex-1">
                <label>IVA (%) *</label>
                <input type="number" step="0.01" name="iva" id="edit-iva" required>
              </section>
              <section class="flex-1">
                <label>Cantidad Stock</label>
                <input type="number" name="stock" id="edit-stock">
              </section>
            </section>
            <section class="row mt-4">
              <section class="flex-1">
                <label>Desvincular Oferta</label>
                <div class="mt-2">
                  <input type="checkbox" name="quitar_oferta" value="1" id="edit-quitar-oferta">
                  <label for="edit-quitar-oferta" class="d-inline fw-normal">Quitar oferta actual del producto</label>
                </div>
              </section>
            </section>

            <section class="row mt-4">
              <button type="submit" class="btn pill orange">Guardar cambios</button>
              <button type="button" class="btn secondary" data-close-edit>Cancelar</button>
            </section>
          </form>
        </section>

        <footer class="footer">© 2026 Flores Nuria · Administración de productos</footer>
      </section>
    </main>
  </section>
</body>
</html>
