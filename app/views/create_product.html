<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Floristería - Panel</title>
  <link rel="stylesheet" href="../../assets/css/styles.css">
  <link rel="icon" href="../../assets/img/logo_fondo_blanco.jpg">
  <script src="../../assets/js/core/api.js" defer></script>
  <script src="../../assets/js/core/utils.js" defer></script>
  <script src="../../assets/js/core/layout.js" defer></script>
  <script src="../../assets/js/pages/create_product.js" defer></script>
</head>
<body>
  <section class="app">
    <div data-include="sidebar"></div>
    <main class="main">
      <div data-include="header"></div>
      <section class="container">
        <section class="toolbar d-flex gap-2 mb-3">
          <a href="products.html" class="btn secondary text-decoration-none d-flex align-center px-3">&laquo; Volver a Productos</a>
        </section>

        <h3 class="mt-5 mb-3">Crear Nuevo Producto</h3>
        <div id="msg"></div>

        <section class="form">
          <form id="form-create-product">
            <section class="row">
              <section class="flex-2">
                <label>Nombre del Producto *</label>
                <input type="text" name="nombre" placeholder="Ej: Rosa roja" required>
              </section>
              <section class="flex-1">
                <label>Precio Base (€) *</label>
                <input type="number" step="0.01" name="precio" min="0.01" required>
              </section>
              <section class="flex-1">
                <label>IVA (%)</label>
                <input type="number" step="0.01" name="iva" min="0" max="100" value="21.00" required>
              </section>
              <section class="flex-1">
                <label>Stock Inicial</label>
                <input type="number" name="stock" min="0" value="0">
              </section>
            </section>

            <section class="row mt-4">
              <button type="submit" class="btn">Guardar Producto</button>
            </section>
          </form>
        </section>

        <footer class="footer">© 2026 Flores Nuria · Creación de productos</footer>
      </section>
    </main>
  </section>
</body>
</html>
